<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude AI สำหรับนักโรคพืช</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --green-deep: #1a3a2a;
    --green-mid: #2d6a4f;
    --green-light: #52b788;
    --green-pale: #b7e4c7;
    --cream: #f8f5ee;
    --warm-white: #fdfcf8;
    --text-dark: #1c1c1c;
    --text-mid: #444;
    --text-light: #888;
    --border: #ddd8cc;
    --shadow: rgba(0,0,0,0.08);
    --user-bg: #e8f5ee;
    --ai-bg: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ===== SETUP SCREEN ===== */
  #setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: linear-gradient(160deg, #1a3a2a 0%, #2d6a4f 50%, #52b788 100%);
  }

  .setup-card {
    background: var(--warm-white);
    border-radius: 20px;
    padding: 40px 36px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }

  .logo-area {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #2d6a4f, #52b788);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 32px;
  }

  .logo-area h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--green-deep);
    line-height: 1.3;
  }

  .logo-area .subtitle {
    font-size: 14px;
    color: var(--text-light);
    margin-top: 6px;
    font-weight: 400;
  }

  .training-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #e8f5ee;
    border: 1px solid var(--green-pale);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--green-mid);
    font-weight: 500;
    margin-top: 10px;
  }

  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-mid);
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }

  .input-group {
    margin-bottom: 20px;
  }

  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    background: #fafafa;
    color: var(--text-dark);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  input:focus {
    border-color: var(--green-mid);
    box-shadow: 0 0 0 3px rgba(45,106,79,0.1);
    background: white;
  }

  .hint-text {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 6px;
    line-height: 1.5;
  }

  .hint-text a {
    color: var(--green-mid);
    text-decoration: none;
    font-weight: 500;
  }

  .hint-text a:hover { text-decoration: underline; }

  .topic-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .pill {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: white;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-mid);
    font-family: 'Sarabun', sans-serif;
    font-weight: 500;
  }

  .pill.active {
    border-color: var(--green-mid);
    background: var(--green-mid);
    color: white;
  }

  .btn-start {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #2d6a4f, #40916c);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'Sarabun', sans-serif;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 8px;
    box-shadow: 0 4px 16px rgba(45,106,79,0.3);
  }

  .btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(45,106,79,0.4);
  }

  .btn-start:active { transform: translateY(0); }

  .error-msg {
    background: #fff0f0;
    border: 1px solid #ffcccc;
    color: #cc3333;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  /* ===== CHAT SCREEN ===== */
  #chat-screen {
    display: none;
    flex-direction: column;
    height: 100vh;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }

  .chat-header {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 1px 4px var(--shadow);
  }

  .header-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #2d6a4f, #52b788);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .header-info { flex: 1; min-width: 0; }
  .header-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--green-deep);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-sub {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 1px;
  }

  .topic-tag {
    background: var(--green-pale);
    color: var(--green-deep);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    white-space: nowrap;
  }

  .btn-reset {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-family: 'Sarabun', sans-serif;
    font-size: 12px;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-reset:hover {
    border-color: var(--green-mid);
    color: var(--green-mid);
  }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg-wrap {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-wrap.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg-wrap.user .msg-avatar {
    background: linear-gradient(135deg, #2d6a4f, #52b788);
  }

  .msg-wrap.ai .msg-avatar {
    background: #f0f0f0;
    border: 1px solid var(--border);
  }

  .msg-bubble {
    max-width: 78%;
    padding: 14px 18px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.65;
    word-break: break-word;
  }

  .msg-wrap.user .msg-bubble {
    background: var(--green-mid);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg-wrap.ai .msg-bubble {
    background: white;
    color: var(--text-dark);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 4px var(--shadow);
  }

  .msg-bubble p { margin-bottom: 10px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin-bottom: 10px; }
  .msg-bubble li { margin-bottom: 4px; }
  .msg-bubble strong { font-weight: 600; }
  .msg-bubble code {
    background: #f0f0f0;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  .msg-wrap.user .msg-bubble code {
    background: rgba(255,255,255,0.2);
  }
  .msg-bubble pre {
    background: #1e1e1e;
    color: #d4d4d4;
    padding: 14px;
    border-radius: 8px;
    overflow-x: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    margin: 8px 0;
  }
  .msg-bubble pre code {
    background: none;
    padding: 0;
    color: inherit;
    font-size: inherit;
  }

  /* Thinking indicator */
  .thinking-dots {
    display: flex;
    gap: 5px;
    padding: 4px 0;
  }

  .thinking-dots span {
    width: 8px; height: 8px;
    background: var(--green-light);
    border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }

  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Welcome message */
  .welcome-box {
    background: linear-gradient(135deg, #e8f5ee, #f0faf4);
    border: 1px solid var(--green-pale);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 8px;
  }

  .welcome-box h3 {
    font-size: 16px;
    font-weight: 700;
    color: var(--green-deep);
    margin-bottom: 8px;
  }

  .welcome-box p {
    font-size: 14px;
    color: var(--text-mid);
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .example-prompts {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .example-btn {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    text-align: left;
    font-family: 'Sarabun', sans-serif;
    font-size: 13px;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.4;
  }

  .example-btn:hover {
    border-color: var(--green-mid);
    color: var(--green-deep);
    background: #f8fff8;
  }

  /* Input area */
  .chat-input-area {
    background: white;
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    box-shadow: 0 -2px 8px var(--shadow);
  }

  .char-count {
    font-size: 11px;
    color: var(--text-light);
    text-align: right;
    margin-bottom: 4px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-family: 'Sarabun', sans-serif;
    font-size: 15px;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 160px;
    overflow-y: auto;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa;
  }

  textarea:focus {
    border-color: var(--green-mid);
    box-shadow: 0 0 0 3px rgba(45,106,79,0.1);
    background: white;
  }

  .btn-send {
    width: 46px;
    height: 46px;
    background: var(--green-mid);
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.1s;
    flex-shrink: 0;
  }

  .btn-send:hover { background: var(--green-deep); }
  .btn-send:active { transform: scale(0.95); }
  .btn-send:disabled { background: #ccc; cursor: not-allowed; }

  .btn-send svg { width: 20px; height: 20px; }

  .btn-img {
    width: 46px;
    height: 46px;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text-mid);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    font-size: 20px;
  }

  .btn-img:hover {
    border-color: var(--green-mid);
    color: var(--green-mid);
  }

  .img-preview-wrap {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #f0faf4;
    border: 1px solid var(--green-pale);
    border-radius: 10px;
    margin-bottom: 8px;
  }

  .img-preview-wrap img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .img-preview-name {
    flex: 1;
    font-size: 13px;
    color: var(--text-mid);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .btn-remove-img {
    background: none;
    border: none;
    color: var(--text-light);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.2s;
  }

  .btn-remove-img:hover { color: #cc3333; }

  .msg-image {
    max-width: 240px;
    border-radius: 10px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    display: block;
  }

  .footer-note {
    font-size: 11px;
    color: var(--text-light);
    text-align: center;
    margin-top: 8px;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .setup-card { padding: 28px 20px; }
    .logo-area h1 { font-size: 19px; }
    #messages { padding: 16px 14px; gap: 12px; }
    .msg-bubble { max-width: 88%; font-size: 14px; padding: 12px 14px; }
    .chat-input-area { padding: 12px 14px; }
    textarea { font-size: 14px; }
    .topic-pills { gap: 6px; }
    .pill { font-size: 12px; padding: 5px 12px; }
  }
</style>
</head>

<div id="setup-screen">
  <div class="setup-card">

<div id="chat-screen">

## หัวข้อที่ 1: Prompt Engineering
- ช่วยออกแบบ prompt ที่มีประสิทธิภาพสำหรับงานสอนและวิจัยโรคพืช

- ช่วยเขียน prompt สำหรับงานเฉพาะ เช่น วิเคราะห์โรคพืช, ร่างบทความ, สรุปผลการทดลอง, ออกข้อสอบ
- แสดง prompt ตัวอย่างที่ดีและไม่ดีเพื่อเปรียบเทียบ และช่วยปรับปรุง prompt ที่มีอยู่

## หัวข้อที่ 2: Automation ด้วย Google Workspace
- แนะนำการใช้ Google Form สำหรับเก็บข้อมูลภาคสนามโรคพืช
- อธิบาย Google Sheets: สูตร, การจัดระเบียบข้อมูล, pivot table, chart สำหรับข้อมูลโรคพืช
- ช่วยสร้าง workflow อัตโนมัติด้วย Google Apps Script (อธิบายเป็นขั้นตอน)
- แนะนำ Google Docs: template รายงาน, การผสานข้อมูลจาก Sheets
- เชื่อมโยงกับงานจริง: สำรวจโรค, รายงานผล, ส่งอีเมลอัตโนมัติ, สร้างใบรับรอง

## หัวข้อที่ 3: โรคพืชและงานวิจัย
- ตอบคำถามด้านโรคพืช: การวินิจฉัยโรค, สาเหตุโรค, การจัดการ, ชีวภัณฑ์
- ช่วยงานวิจัย: ออกแบบการทดลอง, วิเคราะห์สถิติเบื้องต้น, เขียนบทคัดย่อ, แปลเอกสารวิชาการ
- ช่วยงานการสอน: ออกข้อสอบ, สร้างสื่อการสอน, อธิบายแนวคิดยาก
- ให้ข้อมูลเกี่ยวกับเครื่องมือดิจิทัล: AI, GIS (QGIS, Google Earth Engine), KoboToolbox
- วิเคราะห์ภาพโรคพืช (หากมีการแนบภาพ)

- ตอบในเชิงปฏิบัติ มีตัวอย่างจริงที่ใช้ได้ทันที

- ระบุเมื่อไม่แน่ใจ และเน้นการประยุกต์ใช้กับบริบทเกษตรกรรมไทย`;


  // ===== EXAMPLE PROMPTS =====
  const examples = {
    prompt: [
      '🎯 ช่วยเขียน prompt สำหรับวินิจฉัยโรคข้าวจากภาพถ่าย',

      '🔬 ช่วยสร้าง prompt สำหรับสรุปผลการทดลองชีวภัณฑ์',
      '✏️ ปรับปรุง prompt นี้ให้ดีขึ้น: "อธิบายโรคราน้ำค้าง"',
    ],
    automation: [
      '📋 สร้าง Google Form สำหรับเก็บข้อมูลสำรวจโรคพืชในแปลงนา',
      '📊 วิธีใช้ Google Sheets วิเคราะห์ข้อมูลความรุนแรงของโรค',
      '📧 ส่งอีเมลสรุปผลอัตโนมัติเมื่อมีข้อมูลใหม่จาก Form',
      '📄 สร้าง template รายงานผลการทดลองใน Google Docs',
    ],
    general: [
      '🌾 ช่วยวินิจฉัยโรคข้าว: ใบมีจุดสีน้ำตาล ขอบเหลือง ที่ใบแก่',
      '📖 สรุปความสำคัญของ NDVI ในการติดตามสุขภาพพืช',
      '🧪 ออกแบบการทดลองทดสอบประสิทธิภาพชีวภัณฑ์ควบคุมโรค',
      '💡 AI ช่วยงานวิจัยโรคพืชได้อย่างไรบ้าง?',

  };


  // ===== SETUP =====
  function startChat() {
    const errEl = document.getElementById('error-msg');

    if (!EMBEDDED_API_KEY || EMBEDDED_API_KEY.length < 20) {
      errEl.textContent = '⚠️ ผู้ดูแลยังไม่ได้ใส่ API Key ในไฟล์ กรุณาแจ้งผู้จัดอบรม';
      errEl.style.display = 'block';
      return;
    }

    errEl.style.display = 'none';
    apiKey = EMBEDDED_API_KEY;
    userName = document.getElementById('name-input').value.trim();

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';

    const sub = userName ? `สวัสดี ${userName} 👋` : 'พร้อมช่วยเหลือ';
    document.getElementById('header-sub').textContent = sub;

    renderWelcome();
  }

  function resetChat() {
    if (!confirm('ต้องการกลับไปหน้าเริ่มต้นและล้างประวัติการสนทนาหรือไม่?')) return;
    conversationHistory = [];
    apiKey = '';
    document.getElementById('chat-screen').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'flex';
    document.getElementById('messages').innerHTML = '';
  }

  // ===== WELCOME =====
  function renderWelcome() {
    const msgs = document.getElementById('messages');
    const name = userName ? `, ${userName}` : '';
    const allExamples = [...examples.prompt, ...examples.automation, ...examples.general];
    // Show 2 from each topic as suggestions
    const shown = [examples.prompt[0], examples.automation[0], examples.general[0], examples.prompt[1]];

    const box = document.createElement('div');
    box.className = 'welcome-box';
    box.innerHTML = `
      <h3>🌿 ยินดีต้อนรับสู่ Claude AI</h3>
      <p>สวัสดีค่ะ${name} 👋<br>วันนี้เราจะเรียนรู้ทั้ง <strong>Prompt Engineering</strong>, <strong>Automation (Form/Sheet/Docs)</strong> และ <strong>งานโรคพืช/วิจัย</strong> — ถามได้ทุกหัวข้อเลยค่ะ</p>
      <div style="font-size:13px;font-weight:600;color:#444;margin-bottom:6px;">💡 ตัวอย่างคำถาม:</div>
      <div class="example-prompts">
        ${shown.map(e => `<button class="example-btn" onclick="useExample(this)">${e}</button>`).join('')}
      </div>
    `;
    msgs.appendChild(box);
  }

  function useExample(btn) {
    const text = btn.textContent.replace(/^[^\s]+\s/, ''); // strip emoji prefix
    document.getElementById('user-input').value = btn.textContent;
    autoResize(document.getElementById('user-input'));
    updateCount(document.getElementById('user-input'));
    document.getElementById('user-input').focus();
  }

  // ===== CHAT =====
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  function updateCount(el) {
    document.getElementById('char-count').textContent = `${el.value.length} / 2000`;
  }

  function addMessage(role, content, image) {
    const msgs = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = `msg-wrap ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (image && role === 'user') {
      const img = document.createElement('img');
      img.src = `data:${image.mediaType};base64,${image.base64}`;
      img.className = 'msg-image';
      bubble.appendChild(img);
    }

    if (role === 'ai') {
      bubble.innerHTML += formatMarkdown(content);
    } else if (content) {
      const p = document.createElement('p');
      p.style.margin = '0';
      p.textContent = content;
      bubble.appendChild(p);
    }

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    return bubble;
  }

  function addThinking() {
    const msgs = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ai';
    wrap.id = 'thinking-wrap';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = `<div class="thinking-dots"><span></span><span></span><span></span></div>`;

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById('thinking-wrap');
    if (el) el.remove();
  }

  function formatMarkdown(text) {
    // Basic markdown → HTML
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c.trim()}</code></pre>`)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/^#{1,3} (.+)$/gm, '<strong>$1</strong>')
      .replace(/^- (.+)$/gm, '• $1')
      .replace(/^\d+\. (.+)$/gm, (_, t) => `• ${t}`)
      .split(/\n{2,}/).map(p => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '').join('');
  }

  function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      alert('รูปขนาดใหญ่เกินไปค่ะ กรุณาใช้รูปไม่เกิน 5MB');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      const base64 = dataUrl.split(',')[1];
      const mediaType = file.type || 'image/jpeg';
      attachedImage = { base64, mediaType, name: file.name };
      document.getElementById('img-preview').src = dataUrl;
      document.getElementById('img-preview-name').textContent = file.name;
      document.getElementById('img-preview-wrap').style.display = 'flex';
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function removeImage() {
    attachedImage = null;
    document.getElementById('img-preview-wrap').style.display = 'none';
    document.getElementById('img-preview').src = '';
  }

  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    // Add user message
    const imageSnapshot = attachedImage;
    addMessage('user', text, imageSnapshot);

    let userContent;
    if (imageSnapshot) {
      userContent = [
        { type: 'image', source: { type: 'base64', media_type: imageSnapshot.mediaType, data: imageSnapshot.base64 } },
        { type: 'text', text: text || 'ช่วยวินิจฉัยโรคพืชจากรูปนี้ด้วยค่ะ' }
      ];
    } else {
      userContent = text;
    }
    conversationHistory.push({ role: 'user', content: userContent });
    removeImage();

    input.value = '';
    input.style.height = 'auto';
    updateCount(input);

    isLoading = true;
    document.getElementById('send-btn').disabled = true;
    addThinking();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1500,
          system: combinedSystemPrompt,
          messages: conversationHistory,
        }),
      });

      removeThinking();

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        const errMsg = err?.error?.message || `HTTP ${response.status}`;
        if (response.status === 401) {
          addMessage('ai', '❌ **API Key ไม่ถูกต้องหรือหมดอายุ** กรุณาตรวจสอบ Key แล้วลองใหม่ค่ะ');
        } else if (response.status === 429) {
          addMessage('ai', '⏳ **ใช้งานเกินโควต้า** กรุณารอสักครู่แล้วลองใหม่ หรือตรวจสอบ credit ใน console.anthropic.com ค่ะ');
        } else {
          addMessage('ai', `❌ เกิดข้อผิดพลาด: ${errMsg}`);
        }
        return;
      }

      const data = await response.json();
      const reply = data.content?.[0]?.text || '(ไม่มีการตอบกลับ)';

      conversationHistory.push({ role: 'assistant', content: reply });
      addMessage('ai', reply);

    } catch (err) {
      removeThinking();
      if (err.message?.includes('Failed to fetch') || err.message?.includes('NetworkError')) {
        addMessage('ai', '🌐 **ไม่สามารถเชื่อมต่อได้** กรุณาตรวจสอบอินเทอร์เน็ตและลองใหม่ค่ะ');
      } else {
        addMessage('ai', `❌ ข้อผิดพลาด: ${err.message}`);
      }
    } finally {
      isLoading = false;
      document.getElementById('send-btn').disabled = false;
      input.focus();
    }
  }
</script>
